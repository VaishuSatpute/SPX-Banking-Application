server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /api/login { proxy_pass http://spx-auth:5000; }
    location = /api/logout { proxy_pass http://spx-auth:5000; }
    location = /logout { proxy_pass http://spx-auth:5000; }
    location = /api/send-otp { proxy_pass http://spx-auth:5000; }
    location = /api/verify-otp { proxy_pass http://spx-auth:5000; }
    location = /api/reset-password { proxy_pass http://spx-auth:5000; }
    location = /api/register { proxy_pass http://spx-registration:5000; }
    location = /api/me { proxy_pass http://spx-accounts:5000; }
    location = /api/profile { proxy_pass http://spx-accounts:5000; }
    location = /api/beneficiaries/verify { proxy_pass http://spx-payments:5000; }
    location = /api/transfer { proxy_pass http://spx-payments:5000; }
    location = /api/transactions { proxy_pass http://spx-statements:5000; }
    location = /api/transactions/statement { proxy_pass http://spx-statements:5000; }
    location = /api/loans { proxy_pass http://spx-loans:5000; }
    location = /api/cards { proxy_pass http://spx-cards:5000; }
    location /api/auth/ { proxy_pass http://spx-auth:5000; }
    location /api/registration/ { proxy_pass http://spx-registration:5000; }
    location /api/payments/ { proxy_pass http://spx-payments:5000; }
    location /api/statements/ { proxy_pass http://spx-statements:5000; }
    location /api/admin/ { proxy_pass http://spx-admin:5000; }
    location = /admin { proxy_pass http://spx-admin:5000; }
    location /admin/ { proxy_pass http://spx-admin:5000; }
    location /api/accounts/ { proxy_pass http://spx-accounts:5000; }
    location /api/loans/ { proxy_pass http://spx-loans:5000; }
    location /api/cards/ { proxy_pass http://spx-cards:5000; }
    location = /cards { proxy_pass http://spx-cards:5000; }
    location /cards/ { proxy_pass http://spx-cards:5000; }
    location = /home/landingPage/cards { proxy_pass http://spx-cards:5000; }
    location /home/landingPage/cards/ { proxy_pass http://spx-cards:5000; }
    location /api/investments/ { proxy_pass http://spx-investments:5000; }
    location /api/insurance/ { proxy_pass http://spx-insurance:5000; }
    location /api/services/ { proxy_pass http://spx-services:5000; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
