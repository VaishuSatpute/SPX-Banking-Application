apiVersion: apps/v1
kind: Deployment
metadata: {name: spx-accounts, namespace: spx-banking}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: spx-accounts}}
  template:
    metadata: {labels: {app.kubernetes.io/name: spx-accounts, spx.feature: accounts}}
    spec:
      containers:
        - name: accounts
          image: SPX_SERVICE_IMAGE
          ports: [{name: http, containerPort: 5000}]
          envFrom: [{configMapRef: {name: spx-service-config}}]
          env:
            - {name: FEATURE, value: accounts}
            - {name: DB_PASS, valueFrom: {secretKeyRef: {name: spx-secrets, key: mysql-password}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: spx-secrets, key: jwt-secret}}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: spx-accounts, namespace: spx-banking}
spec: {selector: {app.kubernetes.io/name: spx-accounts}, ports: [{port: 5000, targetPort: http}]}
---
