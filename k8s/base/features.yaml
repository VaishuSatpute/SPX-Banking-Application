apiVersion: apps/v1
kind: Deployment
metadata: {name: spx-auth, namespace: spx-banking}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: spx-auth}}
  template:
    metadata: {labels: {app.kubernetes.io/name: spx-auth, spx.feature: auth}}
    spec:
      containers:
        - name: auth
          image: SPX_SERVICE_IMAGE
          ports: [{name: http, containerPort: 5000}]
          envFrom: [{configMapRef: {name: spx-service-config}}]
          env:
            - {name: FEATURE, value: auth}
            - {name: DB_PASS, valueFrom: {secretKeyRef: {name: spx-secrets, key: mysql-password}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: spx-secrets, key: jwt-secret}}}
            - {name: SMTP_USER, valueFrom: {secretKeyRef: {name: spx-secrets, key: smtp-user, optional: true}}}
            - {name: SMTP_PASSWORD, valueFrom: {secretKeyRef: {name: spx-secrets, key: smtp-password, optional: true}}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: spx-auth, namespace: spx-banking}
spec: {selector: {app.kubernetes.io/name: spx-auth}, ports: [{port: 5000, targetPort: http}]}
---
