apiVersion: apps/v1
kind: Deployment
metadata:
  name: spx-web
  namespace: spx-banking
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spx-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spx-web
    spec:
      containers:
        - name: web
          image: SPX_WEB_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: spx-web
  namespace: spx-banking
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: spx-web
  ports:
    - name: http
      port: 80
      targetPort: http

