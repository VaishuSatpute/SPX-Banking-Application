apiVersion: v1
kind: ConfigMap
metadata: {name: spx-service-config, namespace: spx-banking}
data:
  DB_HOST: spx-mysql
  DB_PORT: "3306"
  DB_NAME: spxbank
  DB_USER: spxapp
  SMTP_SERVER: smtp.hostinger.com
  SMTP_PORT: "465"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: spx-gateway, namespace: spx-banking}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: spx-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: spx-gateway}}
    spec:
      containers:
        - name: gateway
          image: SPX_GATEWAY_IMAGE
          ports: [{name: http, containerPort: 80}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: spx-gateway, namespace: spx-banking}
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/name: spx-gateway}
  ports: [{name: http, port: 80, targetPort: http}]

