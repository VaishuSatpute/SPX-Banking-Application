apiVersion: v1
kind: Service
metadata:
  name: spx-mysql
  namespace: spx-banking
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: spx-mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spx-mysql-data
  namespace: spx-banking
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spx-mysql
  namespace: spx-banking
spec:
  serviceName: spx-mysql
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: spx-mysql}}
  template:
    metadata: {labels: {app.kubernetes.io/name: spx-mysql}}
    spec:
      containers:
        - name: mysql
          image: SPX_DB_IMAGE
          ports: [{name: mysql, containerPort: 3306}]
          env:
            - {name: MYSQL_DATABASE, value: spxbank}
            - {name: MYSQL_USER, value: spxapp}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: spx-secrets, key: mysql-password}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: spx-secrets, key: mysql-root-password}}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
          readinessProbe:
            exec: {command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: spx-mysql-data}}]


