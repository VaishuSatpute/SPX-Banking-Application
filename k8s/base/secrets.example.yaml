apiVersion: v1
kind: Secret
metadata:
  name: spx-secrets
  namespace: spx-banking
type: Opaque
stringData:
  mysql-root-password: CHANGE_ME
  mysql-password: CHANGE_ME
  jwt-secret: CHANGE_ME_LONG_RANDOM_VALUE
  admin-email: admin@example.com
  # Must be a 60-character bcrypt hash beginning with $2a$, $2b$, or $2y$.
  # Generate with: python -c "import bcrypt; print(bcrypt.hashpw(b'PASSWORD', bcrypt.gensalt()).decode())"
  # Keep the value quoted so YAML and shells preserve every '$' character.
  admin-password-hash: 'CHANGE_ME_BCRYPT_HASH'
  smtp-user: banking@example.com
  smtp-password: CHANGE_ME_SMTP_MAILBOX_PASSWORD

