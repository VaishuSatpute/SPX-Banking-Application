<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPX BANK — Loan Applications Management</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>

    <div class="admin-wrapper">
        
        <!-- SIDEBAR -->
        {% include 'admin_sidebar.html' %}

        <!-- MAIN CONTAINER -->
        <main class="admin-main">
            
            <header class="admin-topbar">
                <div class="admin-topbar-title-group">
                    <h1 class="admin-page-title">Loan Applications & Control</h1>
                    <span class="admin-badge-master">LOAN DESK</span>
                </div>

                <div class="admin-topbar-actions">
                    <button onclick="handleAdminLogout()" class="admin-logout-btn">Logout</button>
                </div>
            </header>

            <div class="admin-content">
                
                <div class="admin-card-table">
                    <div class="table-header-toolbar">
                        <div class="table-title">All Customer Loan Applications</div>
                    </div>

                        <div id="loans-list-container" class="d-flex flex-column gap-3 p-3">
                            <div style="text-align: center; padding: 25px; color: var(--admin-text-muted);">Fetching loan applications...</div>
                        </div>
                </div>

            </div>

        </main>
    </div>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
